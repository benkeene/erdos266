# formalization.yaml — adopted from https://github.com/mathlib-initiative/formalization.yaml
version: "v0.4"

project:
  name: "Erdős problem #266: the Kovač–Tao disproof of Stolarsky's conjecture"
  description: >-
    A Lean 4 formalization, against Mathlib, of the Kovač–Tao resolution of
    Erdős problem #266 (a conjecture of Stolarsky): it is not true that every
    sequence of positive integers with convergent reciprocal sum admits an
    integer shift t >= 1 making the shifted Ahmes series irrational.  The
    stronger construction is also formalized: a strictly increasing sequence
    of positive integers whose shifted series has a rational sum for every
    admissible rational shift.
  authors:
    - "Ben Keene"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Ben Keene"

repository:
  role: substantive-development

classification:
  arxiv: [math.NT, math.CA]
  msc2020: ["11J72", "40A05", "11B83"]

status:
  scope: >-
    COMPLETE for both listed main results.  Solution.lean and the entire
    Erdos266 development library contain no unresolved sorries.
    Challenge.lean contains two deliberate theorem placeholders (the
    Comparator convention: the statements of record, with `sorry` as proof);
    these are excluded from sorry_count under the v0.4 definition of that
    field.  Comparator checks the proved Solution declarations against
    those statements.  Both proved declarations depend on exactly propext,
    Classical.choice and Quot.sound.  Registered with Palomar as
    PALOMAR-2026-08-20-000008 at commit aa0cd43fb45d (2026-08-20).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "Erdos266.erdos_266"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "Erdos266.erdos_266_rational_shifts"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

fidelity:
  divergences: >-
    The arXiv abstract of [KoTa24] states the final construction for integer
    shifts (t in Z) only; the body of the paper proves more.  Checked against
    arXiv v4 (14 Jul 2025): Erdos266.erdos_266_rational_shifts formalizes the
    statement of Theorem 2.11 — a strictly increasing sequence of positive
    integers whose shifted series converges to a rational for every t in Q
    avoiding {-a_n} —
    and Section 2.3 states explicitly that the conjecture is disproved "not
    only when t ranges over the integers" but for rational t.
    Erdos266.erdos_266 is the negative answer to Stolarsky's conjecture as
    recorded by Erdős–Graham (integer shifts t >= 1), implied by Theorem
    2.11.  "Converges to a rational" is rendered as HasSum toward the real
    embedding of a rational; for these series (all but finitely many terms
    positive) unconditional and ordered convergence agree.

sources:
  - title: "On several irrationality problems for Ahmes series"
    authors: ["Vjekoslav Kovač", "Terence Tao"]
    type: "paper"
    id: "https://arxiv.org/abs/2406.17593"
    location: "Theorem 2.11 and Section 2.3 (arXiv v4, 14 Jul 2025)"
    relationship: formalizes
    author_endorsement: "not-contacted"
    note: >-
      The paper whose construction this development formalizes.  The negative
      answer to Stolarsky's question (Erdős problem #266) is its final result.

  - title: "Erdős problem #266 (erdosproblems.com)"
    authors: ["Thomas F. Bloom (site); problem due to Kenneth Stolarsky, recorded by Erdős and Graham"]
    type: "other"
    id: "https://www.erdosproblems.com/266"
    location: "Problem page for #266"
    relationship: background
    note: >-
      The canonical record of the problem, its provenance, and its resolution
      status.  Used to fix the informal statement of record.

  - title: "Formal Conjectures: ErdosProblems/266.lean"
    authors: ["The Formal Conjectures Authors"]
    type: "other"
    id: "https://github.com/google-deepmind/formal-conjectures/blob/main/FormalConjectures/ErdosProblems/266.lean"
    location: "Declarations erdos_266 and erdos_266.variants.all_rationals"
    relationship: adapts
    note: >-
      The formal statements in Challenge.lean are adapted from this file
      (Apache 2.0): category attributes removed, declarations renamed into
      the Erdos266 namespace, mathematical content unchanged.

related_formalizations:
  - id: "https://github.com/google-deepmind/formal-conjectures/blob/main/FormalConjectures/ErdosProblems/266.lean"
    relationship: adapts
    note: >-
      Statement source.  Mapping: erdos_266 -> Erdos266.erdos_266;
      erdos_266.variants.all_rationals -> Erdos266.erdos_266_rational_shifts.
  - id: "https://github.com/plby/lean-proofs/blob/8822f7ddef30fadbd92e1c6ab4ed897af356af5e/src/latest/ErdosProblems/Erdos266.lean"
    relationship: other
    note: >-
      The proof of erdos_266 cited by the Formal Conjectures project.
      Developed separately; no claim of priority or of independence from
      it is made here, and it has not been compared with this development.

automation:
  methods:
    - method: agent
      models: ["Claude Fable 5 (Anthropic)"]
      framework: "Claude Code"
      role: >-
        Wrote essentially all of the Lean source in this repository, working
        interactively in Claude Code under the direction and review of the
        author across many sessions: choosing the Lean formulations, finding
        and repairing proofs, and designing the proof architecture (the
        telescoping route to Lemma 7.1, the adjugate route to Lemma 7.2, the
        simplified scale sequence N_k = 2^(k^2)).  The author selected the
        target, made the mathematical decisions, audited the Challenge
        statements against the sources, and reviewed the output as it was
        produced.
  notes: >-
    Claude (Anthropic), working in Claude Code, wrote essentially all of the
    Lean source interactively under the author's direction and review across
    many sessions: choosing formulations, finding and repairing proofs, and
    designing the proof architecture.  The author selected the target, made
    the mathematical decisions, audited the Challenge statements against
    the sources, and reviewed the output as it was produced.  This is an
    AI-assisted formalization of an existing human result, not an AI
    discovery.

review:
  status: self-assessed
  reviewers:
    - "Ben Keene"
  notes: >-
    The author directs and reviews the development as it is produced.  No
    independent human mathematical review of the statements or the
    correspondence to the sources has been performed.  Separately, every
    step is checked by Lean, and the Palomar registration
    (PALOMAR-2026-08-20-000008, commit aa0cd43fb45d) records an automated
    Comparator check of both compared theorems replayed through Lean's
    kernel and the independent nanoda kernel; that is machine verification,
    not peer review.

known_gaps: []

limitations:
  - >-
    No novelty is claimed anywhere.  The mathematics is due to Kovač and Tao;
    this repository contributes only its formalization, and the formal
    statements are adapted from the Formal Conjectures project.
  - >-
    The two `sorry` placeholders in Challenge.lean specify the Comparator
    targets; they are not unresolved proof obligations in Solution.lean or
    the Erdos266 library, and they are excluded from sorry_count.  The
    compared theorems depend on propext, Classical.choice and Quot.sound
    only; the project-authored sources contain no additional axiom, no
    native_decide, and no unsafe code.

alignment:
  namespace: "Erdos266"
  statements:
    - source: "Stolarsky's conjecture / Erdős problem #266, resolved negatively in [KoTa24]"
      lean: "Erdos266.erdos_266"
      module: "Challenge (statement), Solution (proof)"
      status: proved
      note: >-
        The statement of record, compared by Comparator, in the form given by
        the Formal Conjectures project: the negation of the universally
        quantified conjecture.
    - source: "[KoTa24], final theorem: a sequence whose shifted Ahmes series are all rational"
      lean: "Erdos266.erdos_266_rational_shifts"
      module: "Challenge (statement), Solution (proof)"
      status: proved
      note: >-
        The construction that yields the negative answer; see
        fidelity.divergences for the resolved integer-versus-rational-shift
        point.
