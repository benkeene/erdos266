name: Comparator

# Manual dispatch: judges Solution against Challenge the way Palomar does,
# with the `lake comparator` bundled in this project's own toolchain
# (leanexport, leanchecker, and the independent NanoDa and con-ron kernels),
# under a bubblewrap sandbox. Nothing is built from a separate pin, so the
# judge always matches `lean-toolchain`.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparator:
    name: Check statement against solution
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Lean source requirements before builds
        run: python3 scripts/check-lean-sources.py
      - uses: leanprover/lean-action@v1
        with:
          build: false
      - name: Install bubblewrap for lake comparator's sandbox
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
        # which `bwrap` needs for the sandbox; the runner is disposable.
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run the toolchain's lake comparator
        run: ./scripts/verify-comparator.sh
